function fmtDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}

function fmtDateFull(iso) {

  return dt.toLocaleDateString("pt-BR", { day: "numeric", month: "long" });

function isWithinRange(iso, startIso, endIso) {
  if (!iso || !startIso || !endIso) return false;
  return iso >= startIso && iso <= endIso;
}

  const [y, m, d] = iso.split("-").map(Number);

  const now = new Date();
  now.setHours(0, 0, 0, 0);

/* ============================================================
   PERSISTENCE HOOK
   ============================================================ */
/* Fora do Claude (ex: GitHub Pages), window.storage não existe. Nesse caso:
   - se a pessoa estiver logada (Firebase) e o Firestore estiver configurado
     (window.firebaseDb), os dados sincronizam por conta, na nuvem;
   - senão, usamos localStorage do navegador (funciona sozinho, só que só
     naquele aparelho). */
const localStorageAdapter = {
  async get(key) {
    const raw = window.localStorage.getItem(key);
    return raw ? { key, value: raw } : null;
  },
  async set(key, value) {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
};

function firestoreAdapter(uid) {
  const docRef = window.firebaseDb.collection("estudoOrganizadoUsers").doc(uid);
  return {
    async get(key) {
      const snap = await docRef.get();
      const value = snap.exists ? snap.data()[key] : null;
      return value ? { key, value } : null;
    },
    async set(key, value) {
      await docRef.set({ [key]: value }, { merge: true });
      return { key, value };
    },
  };
}

function getStorageAdapter(uid) {
  if (typeof window !== "undefined" && window.storage) return window.storage; // preview no Claude
  if (typeof window !== "undefined" && window.firebaseDb && uid) return firestoreAdapter(uid); // logado, com Firestore
  return localStorageAdapter; // sem login / sem Firestore configurado
}

/* uid: undefined enquanto o Firebase ainda não respondeu quem está logado,
   null quando não há Firebase (preview) ou ninguém logado, string quando logado. */
function useAppData(uid) {
  const [data, setData] = useState(DEFAULT_DATA);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle"); // idle | saving | saved | error
  const saveTimer = useRef(null);

  useEffect(() => {
    if (uid === undefined) return; // ainda checando quem está logado
    let cancelled = false;
    setLoaded(false);
    (async () => {
      try {
        const storage = getStorageAdapter(uid);
        const result = await storage.get(STORAGE_KEY, false);
        if (!cancelled) {
          if (result && result.value) {
            const parsed = JSON.parse(result.value);
            let mergedSemesters = parsed.semesters && parsed.semesters.length ? parsed.semesters : DEFAULT_DATA.semesters;
            ["s9", "s10"].forEach((id, i) => {
              if (!mergedSemesters.find((s) => s.id === id)) mergedSemesters = [...mergedSemesters, { id, label: `${9 + i}º semestre` }];
            });
            setData({
              ...DEFAULT_DATA, ...parsed,
              settings: { ...DEFAULT_DATA.settings, ...(parsed.settings || {}) },
              semesters: mergedSemesters,
              schedule: parsed.schedule || [],
              internships: parsed.internships || [],
              internshipLogs: parsed.internshipLogs || [],
              absences: parsed.absences || [],
              vacations: parsed.vacations || [],
              holidays: parsed.holidays || [],
              cancelledClasses: parsed.cancelledClasses || [],
              quickLinks: parsed.quickLinks && parsed.quickLinks.length === 4 ? parsed.quickLinks : DEFAULT_QUICK_LINKS,
            });
          } else {
            setData(DEFAULT_DATA);
          }
          setLoaded(true);
        }
      } catch (e) {
        if (!cancelled) setLoaded(true);
      }
    })();
    return () => { cancelled = true; };
  }, [uid]);

  const persist = useCallback((next) => {
    setData(next);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveState("saving");
    saveTimer.current = setTimeout(async () => {
      try {
        const storage = getStorageAdapter(uid);
        const result = await storage.set(STORAGE_KEY, JSON.stringify(next), false);
        setSaveState(result ? "saved" : "error");
      } catch (e) {
        setSaveState("error");
      }
    }, 350);
  }, [uid]);

  return { data, setData: persist, loaded, saveState };
}

/* ============================================================
   SMALL UI PRIMITIVES
   ============================================================ */
function Button({ children, variant = "primary", size = "md", icon, onClick, type = "button", style, disabled }) {
  const base = {
    display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 7,
    fontFamily: "'Plus Jakarta Sans', sans-serif", fontWeight: 600, cursor: disabled ? "not-allowed" : "pointer",
    border: "1px solid transparent", transition: "all .15s ease", whiteSpace: "nowrap",
    opacity: disabled ? 0.5 : 1,
  };
  const sizes = { sm: { fontSize: 13, padding: "7px 12px", borderRadius: 9 }, md: { fontSize: 14, padding: "10px 16px", borderRadius: 11 } };
  const variants = {
    primary: { background: "linear-gradient(135deg, var(--lavender-deep), var(--purple-soft))", color: "#fff", boxShadow: "var(--shadow-sm)" },
    secondary: { background: "var(--surface)", color: "var(--text)", border: "1px solid var(--border)" },
    ghost: { background: "transparent", color: "var(--text-soft)" },
    danger: { background: "var(--danger-bg)", color: "var(--danger)" },
    subtle: { background: "var(--bg-alt)", color: "var(--lavender-deep)" },
  };
  return (
    <button type={type} disabled={disabled} onClick={onClick} style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>
      {icon && <Icon name={icon} size={size === "sm" ? 15 : 16} />}
      {children}
    </button>
  );
}

function Badge({ children, color, bg }) {
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12, fontWeight: 600,
      padding: "3px 9px", borderRadius: 999, color: color || "var(--lavender-deep)", background: bg || "var(--bg-alt)",
      fontFamily: "'Plus Jakarta Sans', sans-serif", lineHeight: 1.4,
    }}>{children}</span>
  );
}

/* ============================================================
   LOGIN SCREEN
   Tela de login pronta visualmente. Os dois pontos marcados com
   TODO são onde a integração real com o Firebase entra quando
   este código for exportado para o projeto no GitHub — dentro
   do preview do Claude não é possível instalar pacotes externos
   como o `firebase`, então aqui ela apenas avança para o app.

function LoginScreen({ onContinue }) {
  const [mode, setMode] = useState("login"); // 'login' | 'signup'
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [forgotMsg, setForgotMsg] = useState(false);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  // Quando o SDK do Firebase (compat) está carregado no index.html, window.firebaseAuth
  // e window.firebaseGoogleProvider existem e o login é real. Caso contrário (ex: aqui
  // dentro do preview do Claude), o app segue direto — não trava a demonstração.
  const hasFirebase = typeof window !== "undefined" && window.firebaseAuth;

  const friendlyError = (code) => ({
    "auth/invalid-email": "E-mail inválido.",
    "auth/user-not-found": "Não existe conta com esse e-mail.",
    "auth/wrong-password": "Senha incorreta.",
    "auth/invalid-credential": "E-mail ou senha incorretos.",
    "auth/email-already-in-use": "Já existe uma conta com esse e-mail.",
    "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
  }[code] || "Não foi possível entrar. Tente novamente.");

  const handleEmailSubmit = async (e) => {
    e.preventDefault();
    setError("");
    if (!hasFirebase) { onContinue(); return; }
    setBusy(true);
    try {
      if (mode === "login") {
        await window.firebaseAuth.signInWithEmailAndPassword(email, password);
      } else {
        await window.firebaseAuth.createUserWithEmailAndPassword(email, password);
      }
      onContinue();
    } catch (err) {
      setError(friendlyError(err.code));
    } finally {
      setBusy(false);
    }
  };

  const handleGoogleLogin = async () => {
    setError("");
    if (!hasFirebase) { onContinue(); return; }
    setBusy(true);
    try {
      await window.firebaseAuth.signInWithPopup(window.firebaseGoogleProvider);
      onContinue();
    } catch (err) {
      setError(friendlyError(err.code));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{
      minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
      background: "linear-gradient(160deg, var(--bg) 0%, var(--bg-alt) 100%)", fontFamily: "'Plus Jakarta Sans', sans-serif",
    }}>
      <style>{`${FONT_IMPORT}\n:root{${TOKENS}}\nhtml,body{margin:0;padding:0;}\ninput::placeholder{color:var(--text-mute);}\ninput:focus{border-color:var(--lavender-deep) !important; box-shadow:0 0 0 3px rgba(143,121,196,0.14);}`}</style>

      <div style={{ width: "100%", maxWidth: 380 }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 26 }}>
          <div style={{
            width: 56, height: 56, borderRadius: 16, background: "linear-gradient(135deg, var(--lavender-deep), var(--purple-soft))",
            display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "var(--shadow-md)", marginBottom: 14,
          }}>
            <span style={{ fontFamily: "'Fraunces', serif", fontSize: 32, fontWeight: 500, color: "#fff", lineHeight: 1 }}>Ψ</span>
          </div>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 24, fontWeight: 500, color: "var(--text)" }}>Estudo Organizado</div>
          <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-mute)", marginTop: 3 }}>para estudantes de Psicologia</div>
        </div>

        <form onSubmit={handleEmailSubmit} style={{
          background: "var(--surface)", border: "1px solid var(--border-soft)", borderRadius: "var(--radius-lg)",
          padding: 26, boxShadow: "var(--shadow-lg)", display: "flex", flexDirection: "column", gap: 14,
        }}>
          <div style={{ display: "flex", background: "var(--bg-alt)", borderRadius: 11, padding: 3, marginBottom: 4 }}>
            <button type="button" onClick={() => setMode("login")} style={{
              flex: 1, padding: "8px 0", borderRadius: 9, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700,
              background: mode === "login" ? "var(--surface)" : "transparent", color: mode === "login" ? "var(--lavender-deep)" : "var(--text-mute)",
              boxShadow: mode === "login" ? "var(--shadow-sm)" : "none",
            }}>Entrar</button>
            <button type="button" onClick={() => setMode("signup")} style={{
              flex: 1, padding: "8px 0", borderRadius: 9, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700,
              background: mode === "signup" ? "var(--surface)" : "transparent", color: mode === "signup" ? "var(--lavender-deep)" : "var(--text-mute)",
              boxShadow: mode === "signup" ? "var(--shadow-sm)" : "none",
            }}>Criar conta</button>
          </div>

          <Field label="E-mail"><input type="email" required style={fieldStyle} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="voce@email.com" /></Field>
          <Field label="Senha"><PasswordField required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" autoComplete="current-password" /></Field>

          {mode === "login" && (
            <button type="button" onClick={() => setForgotMsg(true)} style={{ background: "none", border: "none", color: "var(--lavender-deep)", fontSize: 12.5, fontWeight: 600, cursor: "pointer", textAlign: "right", padding: 0, marginTop: -8 }}>
              Esqueci minha senha
            </button>
          )}
          {forgotMsg && <div style={{ fontSize: 12, color: "var(--text-mute)", marginTop: -8 }}>Configure a recuperação de senha no seu projeto Firebase (sendPasswordResetEmail).</div>}
          {error && <div style={{ fontSize: 12.5, color: "var(--danger)", background: "var(--danger-bg)", borderRadius: 8, padding: "8px 10px" }}>{error}</div>}

          <Button type="submit" disabled={busy} style={{ width: "100%", justifyContent: "center", padding: "11px 0" }}>{mode === "login" ? "Entrar" : "Criar conta"}</Button>

          <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "2px 0" }}>
            <div style={{ flex: 1, height: 1, background: "var(--border-soft)" }} />
            <span style={{ fontSize: 11.5, color: "var(--text-mute)", fontWeight: 600 }}>ou</span>
            <div style={{ flex: 1, height: 1, background: "var(--border-soft)" }} />
          </div>

          <Button type="button" variant="secondary" disabled={busy} onClick={handleGoogleLogin} style={{ width: "100%", justifyContent: "center", padding: "11px 0" }}>
            <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
            Continuar com Google
          </Button>
        </form>

        <div style={{ textAlign: "center", fontSize: 11.5, color: "var(--text-mute)", marginTop: 16 }}>
          Pré-visualização — a autenticação real será conectada ao Firebase no seu projeto.
        </div>
        <div style={{ textAlign: "center", fontSize: 11.5, color: "var(--text-mute)", marginTop: 6 }}>
          Precisa de ajuda? <a href="mailto:plamailypainelfinanceiro@gmail.com" style={{ color: "var(--lavender-deep)", fontWeight: 600, textDecoration: "none" }}>plamailypainelfinanceiro@gmail.com</a>
        </div>
      </div>
    </div>
  );
}


function App() {
  const [authed, setAuthed] = useState(false);
  // undefined = ainda checando quem está logado; null = sem Firebase/deslogado; string = uid logado
  const [userId, setUserId] = useState(typeof window === "undefined" || !window.firebaseAuth ? null : undefined);
  const authChecked = userId !== undefined;

  useEffect(() => {
    if (typeof window === "undefined" || !window.firebaseAuth) return;
    const unsubscribe = window.firebaseAuth.onAuthStateChanged((user) => {
      setAuthed(!!user);
      setUserId(user ? user.uid : null);
    });
    return unsubscribe;
  }, []);

  const { data, setData, loaded, saveState } = useAppData(userId);
  const [tab, setTab] = useState("overview");
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [isMobile, setIsMobile] = useState(typeof window !== "undefined" ? window.innerWidth < 900 : false);

  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 900);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  // generic CRUD helpers scoped to a collection key
  const update = useCallback((patchFn) => {
    setData((prev) => {
      const next = typeof patchFn === "function" ? patchFn(prev) : patchFn;
      return next;
    });
  }, [setData]);

  const addItem = (key, item) => update((prev) => ({ ...prev, [key]: [...prev[key], { id: uid(), ...item }] }));
  const editItem = (key, id, patch) => update((prev) => ({ ...prev, [key]: prev[key].map((it) => (it.id === id ? { ...it, ...patch } : it)) }));
  const removeItem = (key, id) => update((prev) => {
    const next = { ...prev, [key]: prev[key].filter((it) => it.id !== id) };
    // cascade cleanup of references
    if (key === "subjects") {
      ["tasks", "exams", "contents", "studySessions", "revisions", "schedule", "absences"].forEach((k) => {
        next[k] = next[k].filter((it) => it.subjectId !== id);
      });
    }
    if (key === "internships") {
      next.internshipLogs = next.internshipLogs.filter((l) => l.internshipId !== id);
    }
    if (key === "contents") {
      next.revisions = next.revisions.map((r) => (r.contentId === id ? { ...r, contentId: "" } : r));
    }
    return next;
  });

  const selectedSemesterId = data.settings.selectedSemesterId || data.semesters[0]?.id || "s1";
  const currentSemesterId = data.settings.currentSemesterId || selectedSemesterId;
  const setSelectedSemesterId = (id) => update((prev) => ({ ...prev, settings: { ...prev.settings, selectedSemesterId: id } }));
  const setCurrentSemesterId = (id) => update((prev) => ({ ...prev, settings: { ...prev.settings, currentSemesterId: id } }));

  const scopedData = useMemo(() => {
    const subjectIds = new Set(data.subjects.filter((s) => s.semesterId === selectedSemesterId).map((s) => s.id));
    const internshipIds = new Set(data.internships.filter((i) => i.semesterId === selectedSemesterId).map((i) => i.id));
    return {
      ...data,
      subjects: data.subjects.filter((s) => s.semesterId === selectedSemesterId),
      tasks: data.tasks.filter((t) => subjectIds.has(t.subjectId)),
      exams: data.exams.filter((e) => subjectIds.has(e.subjectId)),
      contents: data.contents.filter((c) => subjectIds.has(c.subjectId)),
      studySessions: data.studySessions.filter((s) => subjectIds.has(s.subjectId)),
      revisions: data.revisions.filter((r) => subjectIds.has(r.subjectId)),
      schedule: data.schedule.filter((s) => s.semesterId === selectedSemesterId),
      internships: data.internships.filter((i) => i.semesterId === selectedSemesterId),
      internshipLogs: data.internshipLogs.filter((l) => internshipIds.has(l.internshipId)),
      absences: data.absences.filter((a) => subjectIds.has(a.subjectId)),
      vacations: data.vacations.filter((v) => v.semesterId === selectedSemesterId),
      holidays: data.holidays.filter((h) => h.semesterId === selectedSemesterId),
      cancelledClasses: data.cancelledClasses.filter((c) => c.semesterId === selectedSemesterId),
    };
  }, [data, selectedSemesterId]);

  const ctx = {
    data: scopedData, fullData: data, addItem, editItem, removeItem, update,
    semesters: data.semesters, selectedSemesterId, setSelectedSemesterId, currentSemesterId, setCurrentSemesterId,
  };

  if (!loaded || !authChecked) {
    return (
      <div style={{ minHeight: 400, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Plus Jakarta Sans', sans-serif", color: "var(--text-mute)" }}>
        <style>{`:root{${TOKENS}} html,body{margin:0;padding:0;}`}</style>
        Carregando…
      </div>
    );
  }

  if (!authed) {
    return <LoginScreen onContinue={() => setAuthed(true)} />;
  }

  return (
    <div style={{ fontFamily: "'Plus Jakarta Sans', sans-serif", color: "var(--text)", background: "var(--bg)", minHeight: "100vh", width: "100%" }}>
      <style>{`
        ${FONT_IMPORT}
        :root { ${TOKENS} }

        html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }

        button:focus-visible, a:focus-visible { outline: 2px solid var(--lavender-deep); outline-offset: 2px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--lilac); border-radius: 8px; }
        .eo-nav-item { transition: all .15s ease; }
        .eo-card { transition: box-shadow .15s ease, transform .15s ease; }
        @media (max-width: 899px) { .eo-desktop-sidebar { display: none !important; } }
        @media (min-width: 900px) { .eo-mobile-bar { display: none !important; } }
      `}</style>

      <div style={{ display: "flex", minHeight: "100vh" }}>
        {/* DESKTOP SIDEBAR */}
        <aside className="eo-desktop-sidebar" style={{
          width: 236, flexShrink: 0, borderRight: "1px solid var(--border-soft)", background: "var(--surface)",
          display: "flex", flexDirection: "column", padding: "22px 14px", position: "sticky", top: 0, height: "100vh",
        }}>
          <Logo />
          <div style={{ marginTop: 18 }}>
            <SemesterSwitcher semesters={data.semesters} selectedId={selectedSemesterId} currentId={currentSemesterId} onChange={setSelectedSemesterId} />
          </div>
          <button onClick={() => setSearchOpen(true)} style={{
            display: "flex", alignItems: "center", gap: 9, marginTop: 12, padding: "9px 11px", borderRadius: 11,
            border: "1px solid var(--border-soft)", background: "var(--bg)", color: "var(--text-mute)", cursor: "pointer",
            fontFamily: "'Plus Jakarta Sans', sans-serif", fontSize: 13.5,

            <Icon name="search" size={16} />

              <div style={{ marginTop: 18 }}>
                <SemesterSwitcher semesters={data.semesters} selectedId={selectedSemesterId} currentId={currentSemesterId} onChange={setSelectedSemesterId} />
              </div>
              <nav style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 2, overflowY: "auto" }}>
                {NAV.map((n) => <NavItem key={n.key} n={n} active={tab === n.key} onClick={() => { setTab(n.key); setMobileNavOpen(false); }} />)}
              </nav>
            </div>
          </div>
        )}

        {/* MAIN */}
        <main style={{ flex: 1, minWidth: 0, padding: isMobile ? "72px 16px 90px" : "30px 36px 60px", maxWidth: 1180, margin: "0 auto", width: "100%" }}>
          {tab === "overview" && <Overview ctx={ctx} setTab={setTab} />}
          {tab === "subjects" && <SubjectsView ctx={ctx} />}
          {tab === "schedule" && <ScheduleView ctx={ctx} />}
          {tab === "tasks" && <TasksView ctx={ctx} />}
          {tab === "exams" && <ExamsView ctx={ctx} />}
          {tab === "absences" && <AbsencesView ctx={ctx} />}
          {tab === "calendar" && <CalendarView ctx={ctx} />}
          {tab === "contents" && <ContentsView ctx={ctx} />}
          {tab === "study" && <StudyView ctx={ctx} />}
          {tab === "revisions" && <RevisionsView ctx={ctx} />}
          {tab === "internships" && <InternshipsView ctx={ctx} />}
          {tab === "grades" && <GradesView ctx={ctx} />}
          {tab === "settings" && <SettingsView ctx={ctx} />}
        </main>

        {/* MOBILE BOTTOM NAV (subset) */}
        <div className="eo-mobile-bar" style={{
          position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 100, background: "var(--surface)",
          borderTop: "1px solid var(--border-soft)", display: "flex", padding: "6px 4px", justifyContent: "space-around",
        }}>
          {NAV.slice(0, 5).map((n) => (
            <button key={n.key} onClick={() => setTab(n.key)} style={{
              display: "flex", flexDirection: "column", alignItems: "center", gap: 3, background: "none", border: "none",
              color: tab === n.key ? "var(--lavender-deep)" : "var(--text-mute)", padding: "6px 8px", cursor: "pointer",
            }}>
              <Icon name={n.icon} size={19} />
              <span style={{ fontSize: 10, fontWeight: 600 }}>{n.label.split(" ")[0]}</span>
            </button>
          ))}
        </div>

        <GlobalSearch open={searchOpen} onClose={() => setSearchOpen(false)} fullData={data}
          onNavigate={(targetTab, semesterId) => { if (semesterId) setSelectedSemesterId(semesterId); setTab(targetTab); setSearchOpen(false); setMobileNavOpen(false); }} />
      </div>
    </div>
  );
}

function SemesterSwitcher({ semesters, selectedId, currentId, onChange }) {
  const selected = semesters.find((s) => s.id === selectedId);
  return (
    <div>
      <label style={{ fontSize: 10.5, fontWeight: 700, color: "var(--text-mute)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 5, display: "block", padding: "0 4px" }}>Semestre</label>
      <div style={{ position: "relative" }}>
        <select value={selectedId} onChange={(e) => onChange(e.target.value)} style={{
          width: "100%", appearance: "none", padding: "9px 30px 9px 11px", borderRadius: 11, border: "1px solid var(--border)",
          background: "var(--surface)", color: "var(--text)", fontFamily: "'Plus Jakarta Sans', sans-serif", fontSize: 13.5,
          fontWeight: 600, cursor: "pointer",
        }}>
          {semesters.map((s) => <option key={s.id} value={s.id}>{s.label}{s.id === currentId ? " · atual" : ""}</option>)}

        <span style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", color: "var(--text-mute)", pointerEvents: "none" }}><Icon name="chevronRight" size={13} style={{ transform: "rotate(90deg)" }} /></span>

}

/* ============================================================
   GLOBAL SEARCH
   ============================================================ */
function normalizeText(s) {
  return (s || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function GlobalSearch({ open, onClose, fullData, onNavigate }) {
  const [q, setQ] = useState("");
  useEffect(() => { if (!open) setQ(""); }, [open]);
  if (!open) return null;

  const nq = normalizeText(q);
  const semesterLabel = (id) => fullData.semesters.find((s) => s.id === id)?.label || "";
  const subjectOf = (id) => fullData.subjects.find((s) => s.id === id);

  const results = [];
  if (nq.length >= 2) {
    fullData.subjects.forEach((s) => {
      if (normalizeText(s.name).includes(nq) || normalizeText(s.description).includes(nq)) {
        results.push({ type: "Matéria", icon: "subjects", title: s.name, subtitle: semesterLabel(s.semesterId), tab: "subjects", semesterId: s.semesterId, color: s.color });
      }
    });
    fullData.tasks.forEach((t) => {
      if (normalizeText(t.title).includes(nq) || normalizeText(t.description).includes(nq)) {
        const subj = subjectOf(t.subjectId);
        results.push({ type: "Tarefa", icon: "tasks", title: t.title, subtitle: `${subj?.name || ""} · ${semesterLabel(subj?.semesterId)}`, tab: "tasks", semesterId: subj?.semesterId, color: subj?.color });
      }
    });
    fullData.exams.forEach((e) => {
      if (normalizeText(e.type).includes(nq) || normalizeText(e.description).includes(nq)) {
        const subj = subjectOf(e.subjectId);
        results.push({ type: "Prova/Trabalho", icon: "exams", title: `${e.type} — ${subj?.name || ""}`, subtitle: semesterLabel(subj?.semesterId), tab: "exams", semesterId: subj?.semesterId, color: subj?.color });
      }
    });
    fullData.contents.forEach((c) => {
      if (normalizeText(c.title).includes(nq) || normalizeText(c.notes).includes(nq)) {
        const subj = subjectOf(c.subjectId);
        results.push({ type: "Conteúdo", icon: "contents", title: c.title, subtitle: `${subj?.name || ""} · ${semesterLabel(subj?.semesterId)}`, tab: "contents", semesterId: subj?.semesterId, color: subj?.color });
      }
    });
    fullData.revisions.forEach((r) => {
      const subj = subjectOf(r.subjectId);
      if (normalizeText(subj?.name).includes(nq) || normalizeText(r.notes).includes(nq)) {
        results.push({ type: "Revisão", icon: "review", title: `Revisão — ${subj?.name || ""}`, subtitle: semesterLabel(subj?.semesterId), tab: "revisions", semesterId: subj?.semesterId, color: subj?.color });
      }
    });
    fullData.studySessions.forEach((s) => {
      const subj = subjectOf(s.subjectId);
      if (normalizeText(subj?.name).includes(nq) || normalizeText(s.contentDescription).includes(nq)) {
        results.push({ type: "Estudo", icon: "study", title: `${subj?.name || ""} — ${s.contentDescription || "sessão de estudo"}`, subtitle: semesterLabel(subj?.semesterId), tab: "study", semesterId: subj?.semesterId, color: subj?.color });
      }
    });
    fullData.schedule.forEach((s) => {
      const subj = subjectOf(s.subjectId);
      if (normalizeText(subj?.name).includes(nq) || normalizeText(s.professor).includes(nq) || normalizeText(s.location).includes(nq)) {
        results.push({ type: "Horário", icon: "grid", title: `${subj?.name || ""} — ${WEEKDAYS[s.weekday]}`, subtitle: `${s.professor || semesterLabel(subj?.semesterId)}`, tab: "schedule", semesterId: subj?.semesterId, color: subj?.color });
      }
    });
    fullData.internships.forEach((it) => {
      if (normalizeText(it.local).includes(nq) || normalizeText(it.area).includes(nq) || normalizeText(it.supervisorName).includes(nq)) {
        results.push({ type: "Estágio", icon: "briefcase", title: it.local, subtitle: `${it.area} · ${semesterLabel(it.semesterId)}`, tab: "internships", semesterId: it.semesterId, color: "var(--accent-mint)" });
      }
    });
  }

  return (
    <div onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }} style={{
      position: "fixed", inset: 0, background: "rgba(44,35,64,0.32)", zIndex: 1000, display: "flex",
      alignItems: "flex-start", justifyContent: "center", padding: "10vh 16px 16px",
    }}>
      <div style={{ width: "100%", maxWidth: 560, background: "var(--surface)", borderRadius: "var(--radius-lg)", boxShadow: "var(--shadow-lg)", overflow: "hidden", border: "1px solid var(--border-soft)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", borderBottom: "1px solid var(--border-soft)" }}>
          <Icon name="search" size={18} style={{ color: "var(--text-mute)" }} />
          <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Pesquisar em matérias, tarefas, provas, conteúdos…"
            style={{ flex: 1, border: "none", outline: "none", fontSize: 15, fontFamily: "'Plus Jakarta Sans', sans-serif", background: "transparent", color: "var(--text)" }} />
          <button onClick={onClose} style={{ background: "var(--bg-alt)", border: "none", borderRadius: 8, width: 28, height: 28, cursor: "pointer", color: "var(--text-soft)" }}><Icon name="close" size={14} /></button>
        </div>
        <div style={{ maxHeight: "56vh", overflowY: "auto", padding: results.length ? "8px" : "0" }}>
          {nq.length < 2 ? (
            <div style={{ padding: "28px 20px", textAlign: "center", fontSize: 13.5, color: "var(--text-mute)" }}>Digite ao menos 2 caracteres para pesquisar em todo o sistema, em todos os semestres.</div>
          ) : results.length === 0 ? (
            <div style={{ padding: "28px 20px", textAlign: "center", fontSize: 13.5, color: "var(--text-mute)" }}>Nenhum resultado para "{q}".</div>
          ) : results.map((r, i) => (
            <button key={i} onClick={() => onNavigate(r.tab, r.semesterId)} style={{
              width: "100%", display: "flex", alignItems: "center", gap: 11, padding: "10px 11px", borderRadius: 11,
              border: "none", background: "transparent", cursor: "pointer", textAlign: "left",
            }} onMouseEnter={(e) => e.currentTarget.style.background = "var(--bg-alt)"} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
              <div style={{ width: 32, height: 32, borderRadius: 9, background: "var(--bg-alt)", display: "flex", alignItems: "center", justifyContent: "center", color: r.color || "var(--lavender-deep)", flexShrink: 0 }}>
                <Icon name={r.icon} size={16} />
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13.5, fontWeight: 600, color: "var(--text)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.title}</div>
                <div style={{ fontSize: 11.5, color: "var(--text-mute)" }}>{r.type} · {r.subtitle}</div>
              </div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function SaveIndicator({ state }) {

    idle: { text: "Dados salvos", color: "var(--text-mute)" },
    saving: { text: "Salvando…", color: "var(--text-mute)" },
    saved: { text: "Tudo salvo", color: "var(--success)" },
    error: { text: "Erro ao salvar", color: "var(--danger)" },
  };
  const s = map[state] || map.idle;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: s.color, padding: "10px 10px 2px", fontWeight: 600 }}>
      <span style={{ width: 6, height: 6, borderRadius: "50%", background: s.color }} />
      {s.text}
    </div>
  );
}

/* ============================================================
   OVERVIEW (Visão Geral)
   ============================================================ */
function Overview({ ctx, setTab }) {
  const { data, semesters, selectedSemesterId, addItem, editItem, update } = ctx;
  const semesterLabel = semesters.find((s) => s.id === selectedSemesterId)?.label || "";
  const [refDate, setRefDate] = useState(todayISO());
  const isToday = refDate === todayISO();
  const [quickModal, setQuickModal] = useState(null); // 'subject' | 'exam' | 'work' | 'absence' | 'study'
  const [editingLink, setEditingLink] = useState(null);

  const userName = data.settings.userName || "";
  const hour = new Date().getHours(); // hora local do navegador (fuso do próprio usuário)
  const greeting = hour < 5 ? "boa madrugada" : hour < 12 ? "bom dia" : hour < 18 ? "boa tarde" : "boa noite";

  const pendingTasks = data.tasks.filter((t) => t.status !== "done");
  const lateTasks = pendingTasks.filter((t) => t.dueDate && daysDiff(t.dueDate) < 0);
  const upcomingExams = data.exams.filter((e) => e.date && daysDiff(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
  const upcomingWorks = upcomingExams.filter((e) => e.type?.startsWith("T"));
  const upcomingTests = upcomingExams.filter((e) => e.type?.startsWith("P"));
  const upcomingRevisions = data.revisions.filter((r) => r.status !== "done" && r.date && daysDiff(r.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
  const contentsDone = data.contents.filter((c) => c.status === "estudado").length;
  const contentsPending = data.contents.filter((c) => c.status !== "estudado").length;
  const totalMinutes = data.studySessions.reduce((sum, s) => sum + Number(s.duration || 0), 0);
  const hours = Math.floor(totalMinutes / 60);
  const mins = totalMinutes % 60;

  const subjectsNeedingAttention = data.subjects.filter((s) => {
    const sessions = data.studySessions.filter((ss) => ss.subjectId === s.id);
    if (sessions.length === 0) return true;
    const last = sessions.map((s2) => s2.date).sort().pop();
    return daysDiff(last) < -6;
  });

  const attendanceRows = data.subjects.map((s) => ({ subject: s, status: attendanceStatus(s, data.absences) })).filter((x) => x.status.configured);
  const criticalAttendance = attendanceRows.filter((x) => x.status.level === "danger" || x.status.level === "warning").length;
  const currentVacation = data.vacations.find((v) => isWithinRange(todayISO(), v.startDate, v.endDate));

  // "Sua atenção hoje" — sinais reais: urgências + próximos compromissos (7 dias)
  const attention = [];
  if (lateTasks.length > 0) attention.push({ icon: "tasks", text: `${lateTasks.length} tarefa${lateTasks.length > 1 ? "s" : ""} atrasada${lateTasks.length > 1 ? "s" : ""}`, tone: "danger" });
  upcomingTests.filter((e) => daysDiff(e.date) <= 7).forEach((e) => attention.push({
    icon: "exams", text: `${e.type} de ${subjectName(data, e.subjectId)} — ${daysDiff(e.date) === 0 ? "hoje" : daysDiff(e.date) === 1 ? "amanhã" : `em ${daysDiff(e.date)} dias`}`,
    tone: daysDiff(e.date) <= 2 ? "danger" : "warning",
  }));
  upcomingWorks.filter((e) => daysDiff(e.date) <= 7).forEach((e) => attention.push({
    icon: "exams", text: `${e.type} de ${subjectName(data, e.subjectId)} — ${daysDiff(e.date) === 0 ? "hoje" : daysDiff(e.date) === 1 ? "amanhã" : `em ${daysDiff(e.date)} dias`}`,
    tone: daysDiff(e.date) <= 3 ? "danger" : "warning",
  }));
  upcomingRevisions.filter((r) => daysDiff(r.date) <= 3).forEach((r) => attention.push({ icon: "review", text: `Revisão de ${subjectName(data, r.subjectId)} — ${daysDiff(r.date) === 0 ? "hoje" : daysDiff(r.date) === 1 ? "amanhã" : `em ${daysDiff(r.date)} dias`}`, tone: "warning" }));
  const criticalAbsence = attendanceRows.find((x) => x.status.level === "danger") || attendanceRows.find((x) => x.status.level === "warning");
  if (criticalAbsence) attention.push({ icon: "absence", text: `${criticalAbsence.subject.name}: ${criticalAbsence.status.pct}% de faltas${criticalAbsence.status.level === "danger" ? " — limite ultrapassado" : " — perto do limite"}`, tone: criticalAbsence.status.level === "danger" ? "danger" : "warning" });
  if (subjectsNeedingAttention.length > 0) attention.push({ icon: "subjects", text: `${subjectsNeedingAttention[0].name} sem estudo recente`, tone: "info" });

  const nextActivities = useMemo(() => {
    const items = [];
    pendingTasks.forEach((t) => t.dueDate && items.push({ kind: "Tarefa", taskId: t.id, name: t.title, subjectId: t.subjectId, date: t.dueDate, priority: t.priority }));
    upcomingExams.forEach((e) => items.push({ kind: e.type, name: e.description || e.type, subjectId: e.subjectId, date: e.date, time: e.time }));
    upcomingRevisions.forEach((r) => items.push({ kind: "Revisão", name: subjectName(data, r.subjectId), subjectId: r.subjectId, date: r.date }));
    return items.filter((i) => i.date).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 6);
  }, [data]);

  const changeDay = (delta) => {
    const d = new Date(refDate);
    d.setDate(d.getDate() + delta);
    setRefDate(d.toISOString().slice(0, 10));
  };

  const refWeekday = (() => {
    const [y, m, d] = refDate.split("-").map(Number);
    const jsDay = new Date(y, m - 1, d).getDay(); // 0=Dom..6=Sáb
    return (jsDay + 6) % 7; // 0=Seg..6=Dom
  })();
  const todaysClasses = data.schedule.filter((s) => s.weekday === refWeekday).sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""));
  const todaysInternships = data.internships.filter((i) => i.weekday === refWeekday);
  const hasRoutineToday = todaysClasses.length > 0 || todaysInternships.length > 0;

  return (
    <div style={{ position: "relative" }}>
      <span aria-hidden="true" style={{
        position: "absolute", top: -18, right: -4, fontFamily: "'Fraunces', serif", fontSize: 130, lineHeight: 1,
        color: "var(--lavender-deep)", opacity: 0.06, userSelect: "none", pointerEvents: "none", zIndex: -1,
      }}>Ψ</span>
      <PageHeader
        eyebrow={fmtDateLong(refDate)}
        title={userName ? `Olá ${userName}, ${greeting}!` : `Olá, ${greeting}!`}
        subtitle={`Panorama real da sua rotina de estudos — ${semesterLabel}.`}
        right={
          <div style={{ display: "flex", alignItems: "center", gap: 6, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 11, padding: "5px 6px" }}>
            <IconBtn icon="chevronLeft" onClick={() => changeDay(-1)} />
            <button onClick={() => setRefDate(todayISO())} style={{ background: "none", border: "none", fontSize: 13, fontWeight: 600, color: isToday ? "var(--lavender-deep)" : "var(--text-soft)", cursor: "pointer", padding: "0 4px" }}>
              {isToday ? "Hoje" : fmtDayButton(refDate)}
            </button>
            <IconBtn icon="chevronRight" onClick={() => changeDay(1)} />
          </div>
        }
      />

      <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--text-mute)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>Links rápidos</div>
      <QuickLinksPanel quickLinks={data.quickLinks} onEdit={(link) => setEditingLink(link)} />

      {data.subjects.length === 0 && (
        <div style={{ marginBottom: 22 }}>
          <EmptyState icon="subjects" title="Comece criando sua primeira matéria" subtitle="Toda a organização do Estudo Organizado parte das matérias. Cadastre a primeira para liberar tarefas, provas, conteúdos e muito mais." actionLabel="Criar matéria" onAction={() => setTab("subjects")} />
        </div>
      )}

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 18 }}>
        <Button size="sm" icon="study" disabled={data.subjects.length === 0} onClick={() => setQuickModal("study")}>Iniciar estudo</Button>
        <Button size="sm" variant="subtle" icon="plus" onClick={() => setQuickModal("subject")}>Nova matéria</Button>
        <Button size="sm" variant="subtle" icon="plus" disabled={data.subjects.length === 0} onClick={() => setQuickModal("work")}>Novo trabalho</Button>
        <Button size="sm" variant="subtle" icon="plus" disabled={data.subjects.length === 0} onClick={() => setQuickModal("exam")}>Nova prova</Button>
        <Button size="sm" variant="subtle" icon="absence" disabled={data.subjects.length === 0} onClick={() => setQuickModal("absence")}>Registrar falta</Button>
      </div>

      {currentVacation && (
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", borderRadius: "var(--radius-md)", background: "var(--accent-honey-bg)", marginBottom: 18 }}>
          <Icon name="sun" size={17} style={{ color: "var(--accent-honey)", flexShrink: 0 }} />
          <span style={{ fontSize: 13.5, fontWeight: 600, color: "var(--text)" }}>Você está de férias{currentVacation.label ? ` — ${currentVacation.label}` : ""}, até {fmtDate(currentVacation.endDate)}.</span>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginBottom: 22 }}>
        <StatCard icon="clock" label="Tempo estudado" value={totalMinutes === 0 ? "—" : `${hours}h ${mins}min`} tone="sky" />
        <StatCard icon="tasks" label="Tarefas pendentes" value={pendingTasks.length} tone={pendingTasks.length ? "default" : "muted"} />
        <StatCard icon="flag" label="Atrasadas" value={lateTasks.length} tone={lateTasks.length ? "danger" : "muted"} />
        <StatCard icon="exams" label="Próximas provas" value={upcomingTests.length} tone="peach" />
        <StatCard icon="contents" label="Conteúdos pendentes" value={contentsPending} tone="honey" />
        <StatCard icon="review" label="Revisões pendentes" value={upcomingRevisions.length} tone="mint" />
        <StatCard icon="absence" label="Faltas em risco" value={criticalAttendance} tone={criticalAttendance ? "danger" : "muted"} />
      </div>

      {hasRoutineToday && (
        <div style={{ marginBottom: 22 }}>
          <Panel title={isToday ? "Hoje na sua rotina" : `${WEEKDAYS[refWeekday]} na sua rotina`}>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>

function subjectColor(data, id) { return data.subjects.find((s) => s.id === id)?.color || "var(--text-mute)"; }

function attendanceStatus(subject, absences) {
  const total = Number(subject.totalClasses || 0);
  const limitPct = subject.absenceLimitPercent != null && subject.absenceLimitPercent !== "" ? Number(subject.absenceLimitPercent) : 25;
  const used = absences.filter((a) => a.subjectId === subject.id).reduce((sum, a) => sum + Number(a.count || 0), 0);
  if (!total) return { configured: false, used, limitPct, total: 0, pct: null, allowed: null, remaining: null, level: "unset" };
  const pct = Math.round((used / total) * 1000) / 10;
  const allowed = Math.floor((total * limitPct) / 100);
  const remaining = allowed - used;
  let level = "ok";
  if (pct >= limitPct) level = "danger";
  else if (pct >= limitPct * 0.7) level = "warning";
  return { configured: true, used, limitPct, total, pct, allowed, remaining, level };
}

function MiniStat({ label, value }) {

/* Seção reutilizável de anexos (links ilimitados) — usada em Matérias,
   Estágios e onde mais fizer sentido guardar referências externas
   (Google Drive, PDFs, sites, etc.), sem depender da aba Conteúdos. */
function AttachmentsSection({ attachments = [], onAdd, onRemove }) {
  const [label, setLabel] = useState("");
  const [url, setUrl] = useState("");

  const handleAdd = () => {
    if (!url.trim()) return;
    onAdd({ id: uid(), label: label.trim() || url.trim(), url: url.trim() });
    setLabel("");
    setUrl("");
  };

  return (
    <div style={{ marginTop: 4 }}>
      <div style={{ fontSize: 12.5, fontWeight: 700, color: "var(--text-soft)", marginBottom: 6 }}>Anexos e links ({attachments.length})</div>
      {attachments.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {attachments.map((a) => (
            <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 9, background: "var(--bg-alt)" }}>
              <Icon name="link" size={14} style={{ color: "var(--lavender-deep)", flexShrink: 0 }} />
              <a href={a.url} target="_blank" rel="noreferrer" style={{ flex: 1, minWidth: 0, fontSize: 12.5, color: "var(--text)", fontWeight: 600, textDecoration: "none", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{a.label}</a>
              <button onClick={() => onRemove(a.id)} title="Remover" style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-mute)", display: "flex", flexShrink: 0 }}><Icon name="close" size={13} /></button>
            </div>
          ))}
        </div>
      )}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        <input style={{ ...fieldStyle, flex: "1 1 110px" }} value={label} onChange={(e) => setLabel(e.target.value)} placeholder="Nome (opcional)" />
        <input style={{ ...fieldStyle, flex: "2 1 160px" }} value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://…" onKeyDown={(e) => e.key === "Enter" && handleAdd()} />
        <Button size="sm" icon="plus" onClick={handleAdd}>Adicionar</Button>
      </div>
    </div>
  );
}

function TasksView({ ctx }) {
  const { data, addItem, editItem, removeItem } = ctx;
  const [modal, setModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [filter, setFilter] = useState("pending");
  const [subjectFilter, setSubjectFilter] = useState("");

  const filtered = data.tasks.filter((t) => {
    if (subjectFilter && t.subjectId !== subjectFilter) return false;
    if (filter === "pending") return t.status !== "done";
    if (filter === "done") return t.status === "done";
    if (filter === "late") return t.status !== "done" && t.dueDate && daysDiff(t.dueDate) < 0;
    return true;
  }).sort((a, b) => (a.dueDate || "9999").localeCompare(b.dueDate || "9999"));

  const counts = {
    all: data.tasks.length,
    pending: data.tasks.filter((t) => t.status !== "done").length,
    done: data.tasks.filter((t) => t.status === "done").length,
    late: data.tasks.filter((t) => t.status !== "done" && t.dueDate && daysDiff(t.dueDate) < 0).length,
  };

  return (
    <div>
      <PageHeader title="Tarefas" subtitle="Tudo que precisa ser feito, em um só lugar." right={<Button icon="plus" onClick={() => setModal({ mode: "new" })} disabled={data.subjects.length === 0}>Nova tarefa</Button>} />

      {data.subjects.length === 0 ? (
        <EmptyState title="Cadastre uma matéria antes de criar tarefas" subtitle="As tarefas precisam estar vinculadas a uma matéria para se organizarem corretamente." />
      ) : (
        <>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16, alignItems: "center" }}>
            <FilterChip label={`Pendentes (${counts.pending})`} active={filter === "pending"} onClick={() => setFilter("pending")} />
            <FilterChip label={`Atrasadas (${counts.late})`} active={filter === "late"} onClick={() => setFilter("late")} tone="danger" />
            <FilterChip label={`Concluídas (${counts.done})`} active={filter === "done"} onClick={() => setFilter("done")} />
            <FilterChip label={`Todas (${counts.all})`} active={filter === "all"} onClick={() => setFilter("all")} />
            <div style={{ marginLeft: "auto", minWidth: 160 }}>
              <Select value={subjectFilter} onChange={setSubjectFilter} placeholder="Todas as matérias" options={data.subjects.map((s) => ({ value: s.id, label: s.name }))} />
            </div>
          </div>

          {filtered.length === 0 ? (

                      width: 22, height: 22, borderRadius: 7, border: `2px solid ${t.status === "done" ? "var(--success)" : "var(--border)"}`,
                      background: t.status === "done" ? "var(--success)" : "transparent", display: "flex", alignItems: "center", justifyContent: "center",

                    <SubjectDot color={subjectColor(data, t.subjectId)} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14.5, fontWeight: 600, textDecoration: t.status === "done" ? "line-through" : "none", color: t.status === "done" ? "var(--text-mute)" : "var(--text)" }}>{t.title}</div>

function nearestPastDateForWeekday(weekdayIdx, refIso) {
  const base = refIso || todayISO();
  const [y, m, d] = base.split("-").map(Number);
  const ref = new Date(y, m - 1, d);
  const refOurIdx = (ref.getDay() + 6) % 7;
  let diff = refOurIdx - weekdayIdx;
  if (diff < 0) diff += 7;
  ref.setDate(ref.getDate() - diff);
  return ref.toISOString().slice(0, 10);
}

                  {!st.configured ? (
                    <div style={{ marginTop: 12 }}>
                      <div style={{ fontSize: 12.5, color: "var(--text-mute)", marginBottom: 8 }}>Configure a quantidade total de aulas do semestre para acompanhar automaticamente sua frequência.</div>
                      <Button size="sm" variant="subtle" onClick={() => setConfigModal(s)}>Configurar limite</Button>
                    </div>
                  ) : (
                    <>
                      <div style={{ marginTop: 12, display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 5 }}>
                        <span style={{ fontWeight: 700, color: lv.color }}>{st.pct}% de faltas</span>
                        <span style={{ color: "var(--text-mute)" }}>{st.used}/{st.total} aulas</span>
                      </div>
                      <div style={{ height: 8, borderRadius: 6, background: "var(--bg-alt)", overflow: "hidden" }}>
                        <div style={{ height: "100%", width: `${Math.min(100, st.pct)}%`, background: lv.color, borderRadius: 6 }} />
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8 }}>
                        <Badge bg={lv.bg} color={lv.color}>{lv.label}</Badge>
                        <span style={{ fontSize: 11.5, color: "var(--text-mute)" }}>{st.remaining >= 0 ? `${st.remaining} falta(s) restantes` : `${-st.remaining} acima do limite`}</span>
                      </div>
                    </>
                  )}

                  <div style={{ display: "flex", gap: 8, marginTop: 13 }}>
                    <Button size="sm" icon="plus" onClick={() => setAbsenceModal({ mode: "new", subject: s })}>Registrar falta</Button>
                    {subjectAbsences.length > 0 && <Button size="sm" variant="secondary" onClick={() => setExpanded(isOpen ? null : s.id)}>{isOpen ? "Ocultar" : `Ver (${subjectAbsences.length})`}</Button>}
                  </div>

                  {isOpen && (
                    <div style={{ marginTop: 11, borderTop: "1px solid var(--border-soft)", paddingTop: 10, display: "flex", flexDirection: "column", gap: 2 }}>
                      {subjectAbsences.map((a, i) => (
                        <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 2px", borderBottom: i < subjectAbsences.length - 1 ? "1px solid var(--border-soft)" : "none" }}>
                          <span style={{ fontSize: 12, fontWeight: 700, color: "var(--text-soft)", minWidth: 54 }}>{fmtDate(a.date)}</span>
                          <span style={{ flex: 1, fontSize: 12, color: "var(--text-mute)" }}>{a.notes}</span>
                          <Badge>{a.count}x</Badge>
                          <IconBtn icon="trash" onClick={() => setConfirmDelete(a.id)} />
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </>
      )}

      <AttendanceConfigModal open={!!configModal} subject={configModal} onClose={() => setConfigModal(null)}
        onSave={(vals) => { editItem("subjects", configModal.id, vals); setConfigModal(null); }} />

      <AbsenceFormModal open={!!absenceModal} subject={absenceModal?.subject} schedule={data.schedule} onClose={() => setAbsenceModal(null)}
        onSave={(vals) => { addItem("absences", vals); setAbsenceModal(null); }} />

      <ConfirmDialog open={!!confirmDelete} onCancel={() => setConfirmDelete(null)} message="Este registro de falta será excluído permanentemente."
        onConfirm={() => { removeItem("absences", confirmDelete); setConfirmDelete(null); }} />
    </div>
  );
}

function AttendanceConfigModal({ open, subject, onClose, onSave }) {
  const [totalClasses, setTotalClasses] = useState("");
  const [absenceLimitPercent, setAbsenceLimitPercent] = useState("25");

  useEffect(() => {
    if (open && subject) {
      setTotalClasses(subject.totalClasses ?? "");
      setAbsenceLimitPercent(subject.absenceLimitPercent ?? "25");
    }
  }, [open, subject]);

  if (!subject) return null;

  return (
    <Modal open={open} onClose={onClose} title={`Configurar frequência — ${subject.name}`} width={420}>
      <Field label="Total de aulas previstas no semestre"><input type="number" min="0" style={fieldStyle} value={totalClasses} onChange={(e) => setTotalClasses(e.target.value)} placeholder="Ex: 60" /></Field>
      <Field label="Limite de faltas (%)"><input type="number" min="0" max="100" style={fieldStyle} value={absenceLimitPercent} onChange={(e) => setAbsenceLimitPercent(e.target.value)} placeholder="Ex: 25" /></Field>
      <div style={{ fontSize: 12, color: "var(--text-mute)", marginBottom: 6 }}>A maioria das instituições reprova com 25% de faltas — ajuste conforme a regra do seu curso.</div>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 10 }}>
        <Button variant="secondary" onClick={onClose}>Cancelar</Button>
        <Button disabled={totalClasses === ""} onClick={() => onSave({ totalClasses: Number(totalClasses), absenceLimitPercent: Number(absenceLimitPercent || 25) })}>Salvar</Button>
      </div>
    </Modal>
  );
}

function AbsenceFormModal({ open, subject, subjects, schedule, onClose, onSave }) {
  const [subjectId, setSubjectId] = useState("");
  const [date, setDate] = useState(todayISO());
  const [count, setCount] = useState("1");
  const [notes, setNotes] = useState("");

  useEffect(() => { if (open) { setSubjectId(subject?.id || subjects?.[0]?.id || ""); setDate(todayISO()); setCount("1"); setNotes(""); } }, [open, subject]);
  if (!subject && (!subjects || subjects.length === 0)) return null;

  const activeSubjectId = subject?.id || subjectId;
  const activeSubjectName = subject?.name || subjects?.find((s) => s.id === subjectId)?.name || "";
  const classDays = [...new Set(schedule.filter((s) => s.subjectId === activeSubjectId).map((s) => s.weekday))];

  return (
    <Modal open={open} onClose={onClose} title={`Registrar falta${activeSubjectName ? ` — ${activeSubjectName}` : ""}`} width={420}>
      {!subject && <Field label="Matéria"><Select value={subjectId} onChange={setSubjectId} options={(subjects || []).map((s) => ({ value: s.id, label: s.name }))} /></Field>}
      {classDays.length > 0 && (
        <Field label="Dias de aula desta matéria — toque para preencher a data">
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {classDays.map((wd) => (
              <button key={wd} onClick={() => setDate(nearestPastDateForWeekday(wd))} style={{
                padding: "7px 12px", borderRadius: 999, border: "1px solid var(--border)", background: "var(--bg-alt)",
                color: "var(--lavender-deep)", fontSize: 12.5, fontWeight: 700, cursor: "pointer", fontFamily: "'Plus Jakarta Sans', sans-serif",
              }}>{WEEKDAYS[wd]}</button>
            ))}
          </div>
        </Field>
      )}
      <Field label="Data da falta"><input type="date" style={fieldStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <Field label="Quantidade de aulas perdidas"><input type="number" min="1" step="1" style={fieldStyle} value={count} onChange={(e) => setCount(e.target.value)} /></Field>
      <Field label="Observações (opcional)"><input style={fieldStyle} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Ex: Consulta médica" /></Field>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 6 }}>
        <Button variant="secondary" onClick={onClose}>Cancelar</Button>
        <Button disabled={!date || !count || !activeSubjectId} onClick={() => onSave({ subjectId: activeSubjectId, date, count: Number(count), notes: notes.trim() })}>Salvar</Button>
      </div>
    </Modal>
  );
}

const STUDY_PURPOSES = [
  { value: "prova", label: "Prova" },
  { value: "trabalho", label: "Trabalho" },
  { value: "reforco", label: "Reforço" },
  { value: "revisao", label: "Revisão" },
  { value: "leitura", label: "Leitura" },
  { value: "outro", label: "Outro" },
];

function nowHHMM() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function QuickStudyModal({ open, subjects, defaultDate, onClose, onSave }) {
  const [subjectId, setSubjectId] = useState("");
  const [date, setDate] = useState(todayISO());
  const [startTime, setStartTime] = useState("");
  const [endTime, setEndTime] = useState("");
  const [purpose, setPurpose] = useState("prova");
  const [purposeOther, setPurposeOther] = useState("");

  useEffect(() => {
    if (open) {
      setSubjectId(subjects[0]?.id || "");
      setDate(defaultDate || todayISO());
      setStartTime(nowHHMM());
      setEndTime("");
      setPurpose("prova");
      setPurposeOther("");
    }
  }, [open, defaultDate]);

  const duration = (() => {
    if (!startTime || !endTime) return null;
    const [sh, sm] = startTime.split(":").map(Number);
    const [eh, em] = endTime.split(":").map(Number);
    const mins = (eh * 60 + em) - (sh * 60 + sm);
    return mins > 0 ? mins : null;
  })();

  const purposeLabel = purpose === "outro" ? purposeOther.trim() : STUDY_PURPOSES.find((p) => p.value === purpose)?.label;

  const handleSave = () => {
    onSave({
      subjectId, date: date || todayISO(), duration: duration || 0,
      contentDescription: purposeLabel ? `Estudando para: ${purposeLabel}` : "",
      notes: "", purpose: purpose === "outro" ? purposeOther.trim() : purpose,
    });
  };

  return (
    <Modal open={open} onClose={onClose} title="Iniciar estudo" width={420}>
      <Field label="Matéria"><Select value={subjectId} onChange={setSubjectId} options={subjects.map((s) => ({ value: s.id, label: s.name }))} /></Field>
      <Field label="Data"><input type="date" style={fieldStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Começando às"><input type="time" style={fieldStyle} value={startTime} onChange={(e) => setStartTime(e.target.value)} /></Field>
        <Field label="Até que horas?"><input type="time" style={fieldStyle} value={endTime} onChange={(e) => setEndTime(e.target.value)} /></Field>
      </div>
      <Field label="Estudando para quê?">
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {STUDY_PURPOSES.map((p) => (
            <button key={p.value} onClick={() => setPurpose(p.value)} style={{
              padding: "7px 12px", borderRadius: 999, border: "1px solid " + (purpose === p.value ? "transparent" : "var(--border)"),
              background: purpose === p.value ? "var(--lavender-deep)" : "var(--surface)", color: purpose === p.value ? "#fff" : "var(--text-soft)",
              fontSize: 12.5, fontWeight: 700, cursor: "pointer", fontFamily: "'Plus Jakarta Sans', sans-serif",
            }}>{p.label}</button>
          ))}
        </div>
      </Field>
      {purpose === "outro" && <Field label="Qual finalidade?"><input style={fieldStyle} value={purposeOther} onChange={(e) => setPurposeOther(e.target.value)} placeholder="Ex: Fichamento de texto" /></Field>}
      {startTime && endTime && !duration && <div style={{ fontSize: 12, color: "var(--danger)", marginBottom: 8 }}>O horário final precisa ser depois do inicial.</div>}
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 6 }}>
        <Button variant="secondary" onClick={onClose}>Cancelar</Button>
        <Button disabled={!subjectId || !duration} onClick={handleSave}>Iniciar</Button>
      </div>
    </Modal>
  );
}

/* ============================================================
   CALENDAR (Calendário)
   ============================================================ */
function CalendarView({ ctx }) {
  const { data, addItem, removeItem, selectedSemesterId } = ctx;
  const [cursor, setCursor] = useState(() => { const d = new Date(); d.setDate(1); return d; });
  const [selected, setSelected] = useState(null);
  const [vacationModal, setVacationModal] = useState(false);
  const [holidayModal, setHolidayModal] = useState(false);
  const [studyModal, setStudyModal] = useState(false);
  const [confirmDeleteVacation, setConfirmDeleteVacation] = useState(null);
  const [confirmDeleteHoliday, setConfirmDeleteHoliday] = useState(null);

  const dayEvents = useMemo(() => {
    const list = [];
    data.tasks.forEach((t) => t.dueDate && list.push({ id: "task-" + t.id, date: t.dueDate, title: t.title, type: "Tarefa", color: subjectColor(data, t.subjectId) }));
    data.exams.forEach((e) => e.date && list.push({ id: "exam-" + e.id, date: e.date, title: `${e.type} — ${subjectName(data, e.subjectId)}`, type: e.type, color: subjectColor(data, e.subjectId) }));
    data.revisions.forEach((r) => r.date && list.push({ id: "rev-" + r.id, date: r.date, title: `Revisão — ${subjectName(data, r.subjectId)}`, type: "Revisão", color: subjectColor(data, r.subjectId) }));
    data.studySessions.forEach((s) => s.date && list.push({ id: "study-" + s.id, date: s.date, title: `Estudo — ${subjectName(data, s.subjectId)}`, type: "Estudo", color: subjectColor(data, s.subjectId) }));
    return list;
  }, [data]);

  const vacationFor = (iso) => data.vacations.find((v) => isWithinRange(iso, v.startDate, v.endDate));
  const holidayFor = (iso) => data.holidays.find((h) => h.date === iso);
  const isCancelled = (scheduleId, iso) => data.cancelledClasses.some((c) => c.scheduleId === scheduleId && c.date === iso);

  const eventsFor = (iso) => {
    const list = dayEvents.filter((e) => e.date === iso);
    const holiday = holidayFor(iso);
    if (holiday) { list.push({ id: "holiday-" + holiday.id, date: iso, title: holiday.label || "Feriado", type: "Feriado", color: "var(--accent-rose)" }); return list; }
    if (vacationFor(iso)) return list; // sem aulas durante férias
    const [y, m, d] = iso.split("-").map(Number);
    const wd = (new Date(y, m - 1, d).getDay() + 6) % 7;
    data.schedule.filter((s) => s.weekday === wd && !isCancelled(s.id, iso)).forEach((s) => list.push({ id: "class-" + s.id + iso, scheduleId: s.id, date: iso, title: `${subjectName(data, s.subjectId)}${s.startTime ? " · " + s.startTime : ""}`, type: "Aula", color: subjectColor(data, s.subjectId), recurring: true }));
    data.internships.filter((it) => it.weekday === wd).forEach((it) => list.push({ id: "intern-" + it.id + iso, date: iso, title: `Estágio — ${it.local}`, type: "Estágio", color: "var(--accent-mint)", recurring: true }));
    return list;
  };

  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const monthLabel = cursor.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  const selectedEvents = selected ? eventsFor(selected) : [];
  const selectedVacation = selected ? vacationFor(selected) : null;
  const selectedHoliday = selected ? holidayFor(selected) : null;

  return (
    <div>
      <PageHeader title="Calendário" subtitle="Provas, trabalhos, tarefas, revisões, aulas, estágio, férias e feriados — tudo sincronizado." right={
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <Button size="sm" icon="study" disabled={data.subjects.length === 0} onClick={() => setStudyModal(true)}>Adicionar estudo</Button>
          <Button size="sm" icon="flag" variant="secondary" onClick={() => setHolidayModal(true)}>Adicionar feriado</Button>
          <Button size="sm" icon="sun" variant="secondary" onClick={() => setVacationModal(true)}>Registrar férias</Button>
          <div style={{ display: "flex", alignItems: "center", gap: 6, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 11, padding: "5px 6px" }}>
            <IconBtn icon="chevronLeft" onClick={() => setCursor(new Date(year, month - 1, 1))} />
            <span style={{ fontSize: 13, fontWeight: 700, textTransform: "capitalize", minWidth: 120, textAlign: "center" }}>{monthLabel}</span>
            <IconBtn icon="chevronRight" onClick={() => setCursor(new Date(year, month + 1, 1))} />
          </div>
        </div>
      } />

      {(data.vacations.length > 0 || data.holidays.length > 0) && (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
          {data.vacations.map((v) => (
            <div key={v.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 11px", borderRadius: 999, background: "var(--accent-honey-bg)" }}>
              <Icon name="sun" size={14} style={{ color: "var(--accent-honey)" }} />
              <span style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text)" }}>{v.label || "Férias"} · {fmtDate(v.startDate)} – {fmtDate(v.endDate)}</span>
              <button onClick={() => setConfirmDeleteVacation(v.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-mute)", display: "flex" }}><Icon name="close" size={13} /></button>
            </div>
          ))}
          {data.holidays.map((h) => (
            <div key={h.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 11px", borderRadius: 999, background: "var(--accent-rose-bg)" }}>
              <Icon name="flag" size={14} style={{ color: "var(--accent-rose)" }} />
              <span style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text)" }}>{h.label || "Feriado"} · {fmtDate(h.date)}</span>
              <button onClick={() => setConfirmDeleteHoliday(h.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-mute)", display: "flex" }}><Icon name="close" size={13} /></button>
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 16, alignItems: "start" }}>
        <div style={{ background: "var(--surface)", border: "1px solid var(--border-soft)", borderRadius: "var(--radius-lg)", padding: 16, boxShadow: "var(--shadow-sm)" }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 6 }}>
            {["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"].map((d) => <div key={d} style={{ fontSize: 11.5, fontWeight: 700, color: "var(--text-mute)", textAlign: "center", padding: "4px 0" }}>{d}</div>)}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
              const evs = eventsFor(iso);
              const onVacation = vacationFor(iso);
              const onHoliday = holidayFor(iso);
              const isToday = iso === todayISO();
              const isSelected = iso === selected;
              return (
                <button key={i} onClick={() => setSelected(iso)} style={{
                  minHeight: 62, borderRadius: 10, border: isSelected ? "2px solid var(--lavender-deep)" : "1px solid var(--border-soft)",
                  background: onHoliday ? "var(--accent-rose-bg)" : onVacation ? "var(--accent-honey-bg)" : isToday ? "var(--bg-alt)" : "var(--surface)", padding: "6px 5px", cursor: "pointer", textAlign: "left",
                  display: "flex", flexDirection: "column", gap: 3, overflow: "hidden",
                }}>
                  <span style={{ fontSize: 12, fontWeight: isToday ? 800 : 600, color: isToday ? "var(--lavender-deep)" : "var(--text)" }}>{d}</span>
                  <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                    {evs.slice(0, 3).map((e) => <div key={e.id} style={{ height: 4, borderRadius: 3, background: e.color, opacity: e.recurring ? 0.55 : 1 }} />)}
                    {evs.length > 3 && <span style={{ fontSize: 9, color: "var(--text-mute)" }}>+{evs.length - 3}</span>}
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <Panel title={selected ? fmtDayButton(selected) : "Selecione um dia"}>
          {!selected ? <EmptyRow text="Clique em um dia para ver os detalhes." /> : (
            <>
              {selectedHoliday && (
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 10px", borderRadius: 10, background: "var(--accent-rose-bg)", marginBottom: 8 }}>
                  <Icon name="flag" size={15} style={{ color: "var(--accent-rose)" }} />
                  <span style={{ fontSize: 12.5, fontWeight: 600 }}>{selectedHoliday.label || "Feriado"} — sem aulas neste dia</span>
                </div>
              )}
              {selectedVacation && (
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 10px", borderRadius: 10, background: "var(--accent-honey-bg)", marginBottom: 8 }}>
                  <Icon name="sun" size={15} style={{ color: "var(--accent-honey)" }} />
                  <span style={{ fontSize: 12.5, fontWeight: 600 }}>{selectedVacation.label || "Férias"}</span>
                </div>
              )}
              {selectedEvents.length === 0 ? <EmptyRow text="Nada agendado para este dia." /> : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {selectedEvents.map((e) => (
                    <div key={e.id} style={{ padding: "10px 11px", borderRadius: 10, background: "var(--bg-alt)", display: "flex", flexDirection: "column", gap: 3 }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 7 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                          <SubjectDot color={e.color} />
                          <span style={{ fontSize: 12, fontWeight: 700, color: "var(--lavender-deep)" }}>{e.type}</span>
                        </div>
                        {e.type === "Aula" && e.scheduleId && (
                          <button title="Cancelar esta aula (ex: professor faltou)" onClick={() => addItem("cancelledClasses", { scheduleId: e.scheduleId, date: selected, semesterId: selectedSemesterId })} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-mute)", display: "flex" }}>
                            <Icon name="close" size={13} />
                          </button>
                        )}
                      </div>
                      <span style={{ fontSize: 13.5, fontWeight: 500 }}>{e.title}</span>
                    </div>
                  ))}
                </div>
              )}
              {data.cancelledClasses.filter((c) => c.date === selected).length > 0 && (
                <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
                  {data.cancelledClasses.filter((c) => c.date === selected).map((c) => {
                    const sch = data.schedule.find((s) => s.id === c.scheduleId);
                    return (
                      <div key={c.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "7px 10px", borderRadius: 9, background: "var(--bg-alt)" }}>
                        <span style={{ fontSize: 12, color: "var(--text-mute)" }}>Aula de {sch ? subjectName(data, sch.subjectId) : "matéria removida"} cancelada neste dia</span>
                        <button onClick={() => removeItem("cancelledClasses", c.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--lavender-deep)", fontSize: 11.5, fontWeight: 700 }}>Restaurar</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </Panel>
      </div>

      <VacationFormModal open={vacationModal} onClose={() => setVacationModal(false)}
        onSave={(vals) => { addItem("vacations", { ...vals, semesterId: selectedSemesterId }); setVacationModal(false); }} />
      <HolidayFormModal open={holidayModal} onClose={() => setHolidayModal(false)}
        onSave={(vals) => { addItem("holidays", { ...vals, semesterId: selectedSemesterId }); setHolidayModal(false); }} />
      <ConfirmDialog open={!!confirmDeleteVacation} onCancel={() => setConfirmDeleteVacation(null)} message="Este período de férias será removido do calendário."
        onConfirm={() => { removeItem("vacations", confirmDeleteVacation); setConfirmDeleteVacation(null); }} />
      <ConfirmDialog open={!!confirmDeleteHoliday} onCancel={() => setConfirmDeleteHoliday(null)} message="Este feriado será removido do calendário e as aulas voltam a aparecer normalmente nesse dia."
        onConfirm={() => { removeItem("holidays", confirmDeleteHoliday); setConfirmDeleteHoliday(null); }} />
