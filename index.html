/* ============================================================
   STUDY (Estudos) — with a working timer
   ============================================================ */
function StudyView({ ctx }) {
  const { data, addItem, removeItem } = ctx;
  const [modal, setModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [timerState, setTimerState] = useState("idle"); // idle | running | paused
  const [timerSeconds, setTimerSeconds] = useState(0);
  const [timerSubject, setTimerSubject] = useState("");
  const [timerDescription, setTimerDescription] = useState("");
  const intervalRef = useRef(null);

  useEffect(() => {
    if (timerState === "running") {
      intervalRef.current = setInterval(() => setTimerSeconds((s) => s + 1), 1000);
    } else if (intervalRef.current) {
      clearInterval(intervalRef.current);
    }
    return () => intervalRef.current && clearInterval(intervalRef.current);
  }, [timerState]);

  const resetTimer = () => {
    setTimerState("idle");
    setTimerSeconds(0);
    setTimerSubject("");
    setTimerDescription("");
  };

  const finishAndSave = () => {
    if (timerSeconds >= 30 && timerSubject) {
      addItem("studySessions", { subjectId: timerSubject, date: todayISO(), duration: Math.max(1, Math.round(timerSeconds / 60)), contentDescription: timerDescription.trim(), notes: "" });
    }
    resetTimer();
  };

  const sessions = [...data.studySessions].sort((a, b) => b.date.localeCompare(a.date));
  const totalMin = data.studySessions.reduce((s, x) => s + Number(x.duration || 0), 0);
  const bySubject = data.subjects.map((s) => ({ subject: s, min: data.studySessions.filter((x) => x.subjectId === s.id).reduce((sum, x) => sum + Number(x.duration || 0), 0) })).filter((x) => x.min > 0);
  const maxMin = Math.max(1, ...bySubject.map((x) => x.min));

  const fmtTimer = (s) => `${String(Math.floor(s / 3600)).padStart(2, "0")}:${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  return (
    <div>
      <PageHeader title="Estudos" subtitle="Registre suas sessões e acompanhe sua evolução." right={<Button icon="plus" onClick={() => setModal({ mode: "new" })} disabled={data.subjects.length === 0}>Registrar sessão</Button>} />

      {data.subjects.length === 0 ? (
        <EmptyState title="Cadastre uma matéria antes de registrar estudos" subtitle="As sessões de estudo precisam estar vinculadas a uma matéria." />
      ) : (
        <>
          <div style={{ background: "var(--surface)", border: "1px solid var(--border-soft)", borderRadius: "var(--radius-lg)", padding: 20, marginBottom: 18, boxShadow: "var(--shadow-sm)" }}>
            {timerState === "idle" ? (
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
                <div style={{ flex: 1, minWidth: 160 }}>
                  <Field label="Matéria"><Select value={timerSubject} onChange={setTimerSubject} placeholder="Selecione a matéria" options={data.subjects.map((s) => ({ value: s.id, label: s.name }))} /></Field>
                </div>
                <div style={{ flex: 1, minWidth: 160 }}>
                  <Field label="Descrição (o que vai estudar)"><input style={fieldStyle} value={timerDescription} onChange={(e) => setTimerDescription(e.target.value)} placeholder="Ex: Capítulo 3 — Teorias da Personalidade" /></Field>
                </div>
                <div style={{ marginBottom: 15 }}>
                  <Button icon="play" disabled={!timerSubject || !timerDescription.trim()} onClick={() => setTimerState("running")}>Iniciar cronômetro</Button>
                </div>
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 18, flexWrap: "wrap" }}>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: 34, fontWeight: 500, minWidth: 130, color: timerState === "running" ? "var(--lavender-deep)" : "var(--text-mute)" }}>{fmtTimer(timerSeconds)}</div>
                <div style={{ flex: 1, minWidth: 160 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: "var(--text)", display: "flex", alignItems: "center", gap: 7 }}><SubjectDot color={subjectColor(data, timerSubject)} />{subjectName(data, timerSubject)}</div>
                  <div style={{ fontSize: 12.5, color: "var(--text-mute)", marginTop: 2 }}>{timerDescription}{timerState === "paused" ? " · pausado" : ""}</div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  {timerState === "running" ? (
                    <Button icon="pause" variant="secondary" onClick={() => setTimerState("paused")}>Pausar</Button>
                  ) : (
                    <Button icon="play" onClick={() => setTimerState("running")}>Retomar</Button>
                  )}
                  <Button icon="stop" onClick={finishAndSave}>Finalizar</Button>
                  <Button icon="close" variant="danger" onClick={resetTimer}>Cancelar</Button>
                </div>
              </div>
            )}
          </div>

          {bySubject.length > 0 && (
            <Panel title="Tempo por matéria">
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {bySubject.sort((a, b) => b.min - a.min).map((x) => (
                  <div key={x.subject.id}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}>
                      <span style={{ display: "flex", alignItems: "center", gap: 7, fontWeight: 600 }}><SubjectDot color={x.subject.color} />{x.subject.name}</span>
                      <span style={{ color: "var(--text-mute)" }}>{Math.floor(x.min / 60)}h {x.min % 60}min</span>
                    </div>
                    <div style={{ height: 7, borderRadius: 6, background: "var(--bg-alt)" }}><div style={{ height: "100%", width: `${(x.min / maxMin) * 100}%`, background: x.subject.color, borderRadius: 6 }} /></div>
                  </div>
                ))}
              </div>
            </Panel>
          )}

          <div style={{ marginTop: 18 }}>
            <Panel title={`Histórico de sessões · total ${Math.floor(totalMin / 60)}h ${totalMin % 60}min`}>
              {sessions.length === 0 ? <EmptyRow text="Nenhuma sessão registrada ainda." /> : (
                <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                  {sessions.map((s, i) => (
                    <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 6px", borderBottom: i < sessions.length - 1 ? "1px solid var(--border-soft)" : "none" }}>
                      <SubjectDot color={subjectColor(data, s.subjectId)} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 13.5, fontWeight: 600 }}>{subjectName(data, s.subjectId)}</div>
                        {s.contentDescription && <div style={{ fontSize: 12, color: "var(--text-mute)" }}>{s.contentDescription}</div>}
                      </div>
                      <span style={{ fontSize: 12.5, color: "var(--text-soft)", fontWeight: 600 }}>{fmtDate(s.date)}</span>
                      <Badge>{s.duration} min</Badge>
                      <IconBtn icon="trash" onClick={() => setConfirmDelete(s.id)} />
                    </div>
                  ))}
                </div>
              )}
            </Panel>
          </div>
        </>
      )}

      <StudyFormModal open={!!modal} subjects={data.subjects} onClose={() => setModal(null)} onSave={(vals) => { addItem("studySessions", vals); setModal(null); }} />
      <ConfirmDialog open={!!confirmDelete} onCancel={() => setConfirmDelete(null)} message="Este registro de estudo será excluído permanentemente."
        onConfirm={() => { removeItem("studySessions", confirmDelete); setConfirmDelete(null); }} />
    </div>
  );
}

/* ============================================================
   REVISIONS (Revisões)
   ============================================================ */
function RevisionsView({ ctx }) {
  const { data, addItem, editItem, removeItem } = ctx;
  const [modal, setModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [filter, setFilter] = useState("pending");

  const withMeta = data.revisions.map((r) => ({ ...r, late: r.status !== "done" && daysDiff(r.date) < 0 }));
  const filtered = withMeta.filter((r) => {
    if (filter === "pending") return r.status !== "done";
    if (filter === "late") return r.late;
    if (filter === "done") return r.status === "done";
    if (filter === "upcoming") return r.status !== "done" && !r.late;
    return true;
  }).sort((a, b) => a.date.localeCompare(b.date));

  return (
    <div>
      <PageHeader title="Revisões" subtitle="Reforce o que já foi estudado, no momento certo." right={<Button icon="plus" onClick={() => setModal({ mode: "new" })} disabled={data.subjects.length === 0}>Nova revisão</Button>} />

      {data.subjects.length === 0 ? (
        <EmptyState title="Cadastre uma matéria antes de criar revisões" subtitle="As revisões precisam estar vinculadas a uma matéria." />
      ) : (
        <>
          <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
            <FilterChip label="Próximas" active={filter === "upcoming"} onClick={() => setFilter("upcoming")} />
            <FilterChip label="Pendentes" active={filter === "pending"} onClick={() => setFilter("pending")} />
            <FilterChip label="Atrasadas" active={filter === "late"} onClick={() => setFilter("late")} tone="danger" />
            <FilterChip label="Concluídas" active={filter === "done"} onClick={() => setFilter("done")} />
          </div>

          {filtered.length === 0 ? (
            <EmptyState title="Nenhuma revisão neste filtro" subtitle="Crie revisões para reforçar conteúdos já estudados." actionLabel="Nova revisão" onAction={() => setModal({ mode: "new" })} />
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {filtered.map((r) => {
                const content = data.contents.find((c) => c.id === r.contentId);
                return (
                  <div key={r.id} className="eo-card" style={{ display: "flex", alignItems: "center", gap: 12, background: "var(--surface)", border: "1px solid var(--border-soft)", borderRadius: "var(--radius-md)", padding: "13px 14px", boxShadow: "var(--shadow-sm)" }}>
                    <button onClick={() => editItem("revisions", r.id, { status: r.status === "done" ? "pending" : "done" })} style={{
                      width: 22, height: 22, borderRadius: 7, border: `2px solid ${r.status === "done" ? "var(--success)" : "var(--border)"}`,
                      background: r.status === "done" ? "var(--success)" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: "#fff", flexShrink: 0,
                    }}>{r.status === "done" && <Icon name="check" size={13} />}</button>
                    <SubjectDot color={subjectColor(data, r.subjectId)} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14, fontWeight: 600, textDecoration: r.status === "done" ? "line-through" : "none" }}>{subjectName(data, r.subjectId)}{content ? ` — ${content.title}` : ""}</div>
                      {r.notes && <div style={{ fontSize: 12, color: "var(--text-mute)" }}>{r.notes}</div>}
                    </div>
                    <span style={{ fontSize: 12.5, fontWeight: 700, color: r.late ? "var(--danger)" : "var(--text-soft)" }}>{fmtDate(r.date)}</span>
                    <div style={{ display: "flex", gap: 2 }}>
                      <IconBtn icon="edit" onClick={() => setModal({ mode: "edit", revision: r })} />
                      <IconBtn icon="trash" onClick={() => setConfirmDelete(r.id)} />
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}

      <RevisionFormModal open={!!modal} mode={modal?.mode} revision={modal?.revision} subjects={data.subjects} contents={data.contents} onClose={() => setModal(null)}
        onSave={(vals) => { modal.mode === "new" ? addItem("revisions", { ...vals, status: "pending" }) : editItem("revisions", modal.revision.id, vals); setModal(null); }} />
      <ConfirmDialog open={!!confirmDelete} onCancel={() => setConfirmDelete(null)} message="Esta revisão será excluída permanentemente."
        onConfirm={() => { removeItem("revisions", confirmDelete); setConfirmDelete(null); }} />
    </div>
  );
}

function InternshipsView({ ctx }) {
  const { data, addItem, editItem, removeItem, semesters, selectedSemesterId } = ctx;
  const [modal, setModal] = useState(null);
  const [logModal, setLogModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmDeleteLog, setConfirmDeleteLog] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const semesterLabel = semesters.find((s) => s.id === selectedSemesterId)?.label || "";

  return (
    <div>
      <PageHeader title="Estágio" subtitle={`Acompanhe local, supervisão e carga horária — ${semesterLabel}.`} right={<Button icon="plus" onClick={() => setModal({ mode: "new" })}>Novo estágio</Button>} />

      {data.internships.length === 0 ? (
        <EmptyState icon="briefcase" title="Nenhum estágio cadastrado neste semestre" subtitle="Cadastre seu estágio para acompanhar local, supervisor(a), dias da semana e a carga horária cumprida." actionLabel="Novo estágio" onAction={() => setModal({ mode: "new" })} />

            const totalHours = logs.reduce((sum, l) => sum + Number(l.hours || 0), 0);

            const isOpen = expanded === it.id;
            return (
              <div key={it.id} style={{ background: "var(--surface)", border: "1px solid var(--border-soft)", borderRadius: "var(--radius-lg)", padding: 18, boxShadow: "var(--shadow-sm)" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <div style={{ width: 36, height: 36, borderRadius: 10, background: "var(--bg-alt)", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--lavender-deep)" }}><Icon name="briefcase" size={17} /></div>
                    <div>
                      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 17, fontWeight: 500 }}>{it.local}</div>
                      <div style={{ fontSize: 12.5, color: "var(--text-mute)" }}>{it.area}{it.supervisorName ? ` · supervisão de ${it.supervisorName}` : ""}</div>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 2 }}>
                    <IconBtn icon="edit" onClick={() => setModal({ mode: "edit", internship: it })} />
                    <IconBtn icon="trash" onClick={() => setConfirmDelete(it.id)} />
                  </div>
                </div>

                {(it.weekday !== "" && it.weekday != null) && (
                  <div style={{ fontSize: 12.5, color: "var(--text-soft)", marginTop: 10 }}>
                    {WEEKDAYS[it.weekday]}{it.startTime ? `, ${it.startTime}${it.endTime ? `–${it.endTime}` : ""}` : ""}
                  </div>
                )}

                <div style={{ marginTop: 14 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 5 }}>
                    <span style={{ fontWeight: 600 }}>{totalHours}h registradas{goal ? ` de ${goal}h` : ""}</span>
                    {pct !== null && <span style={{ color: "var(--text-mute)" }}>{pct}%</span>}
                  </div>
                  {goal > 0 && (
                    <div style={{ height: 7, borderRadius: 6, background: "var(--bg-alt)", overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${pct}%`, background: "var(--accent-mint)", borderRadius: 6 }} />
                    </div>
                  )}
                </div>

                <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                  <Button size="sm" icon="plus" onClick={() => setLogModal({ mode: "new", internshipId: it.id })}>Registrar horas</Button>
                  <Button size="sm" variant="secondary" onClick={() => setExpanded(isOpen ? null : it.id)}>{isOpen ? "Ocultar registros" : `Ver registros (${logs.length})`}</Button>
                </div>

                {isOpen && (
                  <div style={{ marginTop: 12, borderTop: "1px solid var(--border-soft)", paddingTop: 12 }}>
                    {logs.length === 0 ? <EmptyRow text="Nenhum registro de horas ainda." /> : (
                      <div style={{ display: "flex", flexDirection: "column", gap: 2, marginBottom: 14 }}>
                        {logs.map((l, i) => (
                          <div key={l.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 4px", borderBottom: i < logs.length - 1 ? "1px solid var(--border-soft)" : "none" }}>

                            <div style={{ flex: 1, minWidth: 0 }}>

                              {l.notes && <div style={{ fontSize: 11.5, color: "var(--text-mute)" }}>{l.notes}</div>}
                            </div>
                            <Badge>{l.hours}h</Badge>
                            <IconBtn icon="edit" onClick={() => setLogModal({ mode: "edit", internshipId: it.id, log: l })} />
                            <IconBtn icon="trash" onClick={() => setConfirmDeleteLog(l.id)} />
                          </div>
                        ))}
                      </div>
                    )}
                    <AttachmentsSection attachments={it.attachments || []}
                      onAdd={(att) => editItem("internships", it.id, { attachments: [...(it.attachments || []), att] })}
                      onRemove={(id) => editItem("internships", it.id, { attachments: (it.attachments || []).filter((a) => a.id !== id) })} />
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      <InternshipFormModal open={!!modal} mode={modal?.mode} internship={modal?.internship} onClose={() => setModal(null)}
        onSave={(vals) => { modal.mode === "new" ? addItem("internships", { ...vals, semesterId: selectedSemesterId }) : editItem("internships", modal.internship.id, vals); setModal(null); }} />

      <InternshipLogFormModal open={!!logModal} mode={logModal?.mode} log={logModal?.log} onClose={() => setLogModal(null)}
        onSave={(vals) => { logModal.mode === "new" ? addItem("internshipLogs", { ...vals, internshipId: logModal.internshipId }) : editItem("internshipLogs", logModal.log.id, vals); setLogModal(null); }} />

      <ConfirmDialog open={!!confirmDelete} onCancel={() => setConfirmDelete(null)} message="Este estágio e todos os registros de horas vinculados a ele serão excluídos permanentemente."
        onConfirm={() => { removeItem("internships", confirmDelete); setConfirmDelete(null); }} />
      <ConfirmDialog open={!!confirmDeleteLog} onCancel={() => setConfirmDeleteLog(null)} message="Este registro de horas será excluído permanentemente."
        onConfirm={() => { removeItem("internshipLogs", confirmDeleteLog); setConfirmDeleteLog(null); }} />
    </div>
  );
}

/* ============================================================
   GRADES (Notas e Desempenho)
   ============================================================ */
function GradesView({ ctx }) {
  const { fullData, editItem } = ctx;
  const d = fullData;

  const withGrades = d.exams.filter((e) => e.grade !== "" && e.grade != null);
  const withoutGrades = d.exams.filter((e) => e.grade === "" || e.grade == null);
  const overallAvg = withGrades.length ? withGrades.reduce((sum, e) => sum + Number(e.grade), 0) / withGrades.length : null;

  const semesterGroups = d.semesters.map((sem) => {
    const subjIds = new Set(d.subjects.filter((s) => s.semesterId === sem.id).map((s) => s.id));
    const subjects = d.subjects.filter((s) => subjIds.has(s.id)).map((s) => {
      const exams = withGrades.filter((e) => e.subjectId === s.id);
      const avg = exams.length ? exams.reduce((sum, e) => sum + Number(e.grade), 0) / exams.length : null;
      return { subject: s, exams, avg };
    }).filter((x) => x.exams.length > 0);
    const minutes = d.studySessions.filter((ss) => subjIds.has(ss.subjectId)).reduce((sum, ss) => sum + Number(ss.duration || 0), 0);
    return { semester: sem, subjects, minutes };
  }).filter((g) => g.subjects.length > 0 || g.minutes > 0);

  const maxMinutes = Math.max(1, ...semesterGroups.map((g) => g.minutes));
  const totalMinutesAll = d.studySessions.reduce((sum, ss) => sum + Number(ss.duration || 0), 0);

  return (
    <div>
      <PageHeader title="Notas e Desempenho" subtitle="Sua trajetória acadêmica completa, do 1º ao 10º semestre." />

      {semesterGroups.length === 0 && withoutGrades.length === 0 ? (
        <EmptyState title="Nenhum dado acadêmico ainda" subtitle="Cadastre matérias, provas e trabalhos com notas para ver seu desempenho aqui." />
      ) : (
        <>
          {overallAvg !== null && (
            <div style={{ display: "flex", alignItems: "center", gap: 18, marginBottom: 20, background: "var(--surface)", border: "1px solid var(--border-soft)", borderRadius: "var(--radius-lg)", padding: "18px 22px", boxShadow: "var(--shadow-sm)" }}>
              <div>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: 34, fontWeight: 600, color: overallAvg >= 6 ? "var(--success)" : "var(--danger)" }}>{overallAvg.toFixed(1)}</div>
                <div style={{ fontSize: 12, color: "var(--text-mute)" }}>média geral · {withGrades.length} avaliação{withGrades.length > 1 ? "ões" : ""}</div>
              </div>
              <div style={{ width: 1, height: 40, background: "var(--border-soft)" }} />
              <div>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 600 }}>{Math.floor(totalMinutesAll / 60)}h {totalMinutesAll % 60}min</div>
                <div style={{ fontSize: 12, color: "var(--text-mute)" }}>estudadas em todos os semestres</div>
              </div>
            </div>
          )}

          {semesterGroups.length > 0 && (
            <div style={{ marginBottom: 20 }}>
              <Panel title="Carga horária por semestre">
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {semesterGroups.map((g) => (
                    <div key={g.semester.id}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}>
                        <span style={{ fontWeight: 600 }}>{g.semester.label}</span>
                        <span style={{ color: "var(--text-mute)" }}>{Math.floor(g.minutes / 60)}h {g.minutes % 60}min</span>
                      </div>
                      <div style={{ height: 8, borderRadius: 6, background: "var(--bg-alt)" }}>
                        <div style={{ height: "100%", width: `${(g.minutes / maxMinutes) * 100}%`, background: "var(--lavender-deep)", borderRadius: 6 }} />
                      </div>
                    </div>
                  ))}
                </div>
              </Panel>
            </div>
          )}

          {semesterGroups.filter((g) => g.subjects.length > 0).map((g) => (
            <div key={g.semester.id} style={{ marginBottom: 20 }}>
              <div style={{ fontFamily: "'Fraunces', serif", fontSize: 16, fontWeight: 500, marginBottom: 10 }}>{g.semester.label}</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 10 }}>
                {g.subjects.map((x) => (
                  <div key={x.subject.id} className="eo-card" style={{ background: "var(--surface)", border: "1px solid var(--border-soft)", borderRadius: "var(--radius-md)", padding: 14, boxShadow: "var(--shadow-sm)" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 7 }}><SubjectDot color={x.subject.color} /><span style={{ fontWeight: 600, fontSize: 13.5 }}>{x.subject.name}</span></div>
                    <div style={{ fontFamily: "'Fraunces', serif", fontSize: 24, fontWeight: 600, color: x.avg >= 6 ? "var(--success)" : "var(--danger)" }}>{x.avg.toFixed(1)}</div>
                    <div style={{ fontSize: 11.5, color: "var(--text-mute)", marginTop: 2 }}>média de {x.exams.length} avaliação{x.exams.length > 1 ? "ões" : ""}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          {withGrades.length > 0 && (
            <Panel title="Todas as notas">
              <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                {withGrades.sort((a, b) => (b.date || "").localeCompare(a.date || "")).map((e, i, arr) => (
                  <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 6px", borderBottom: i < arr.length - 1 ? "1px solid var(--border-soft)" : "none" }}>
                    <SubjectDot color={subjectColor(d, e.subjectId)} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 600 }}>{subjectName(d, e.subjectId)} — {e.type}</div>
                      <div style={{ fontSize: 12, color: "var(--text-mute)" }}>{fmtDate(e.date)} · {d.semesters.find((s) => s.id === d.subjects.find((sub) => sub.id === e.subjectId)?.semesterId)?.label}</div>
                    </div>
                    <Badge bg={e.grade >= 6 ? "var(--success-bg)" : "var(--danger-bg)"} color={e.grade >= 6 ? "var(--success)" : "var(--danger)"}>{e.grade}</Badge>
                  </div>
                ))}
              </div>
            </Panel>
          )}
        </>
      )}

      {withoutGrades.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <Panel title="Avaliações sem nota">
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {withoutGrades.map((e, i, arr) => (
                <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 6px", borderBottom: i < arr.length - 1 ? "1px solid var(--border-soft)" : "none" }}>
                  <SubjectDot color={subjectColor(d, e.subjectId)} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 600 }}>{subjectName(d, e.subjectId)} — {e.type}</div>
                    <div style={{ fontSize: 12, color: "var(--text-mute)" }}>{e.date ? fmtDate(e.date) : "sem data"}</div>
                  </div>
                  <input type="number" step="0.1" placeholder="Nota" style={{ ...fieldStyle, width: 80, padding: "6px 8px" }} onBlur={(ev) => { if (ev.target.value !== "") editItem("exams", e.id, { grade: Number(ev.target.value) }); }} />
                </div>
              ))}
            </div>
          </Panel>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   SETTINGS (Configurações)
   ============================================================ */
function SettingsView({ ctx }) {
  const { fullData, update, semesters, currentSemesterId, setCurrentSemesterId, setSelectedSemesterId } = ctx;
  const [userName, setUserName] = useState(fullData.settings.userName || "");
  const [newSemester, setNewSemester] = useState("");
  const [confirmDeleteSemester, setConfirmDeleteSemester] = useState(null);
  const [confirmClearData, setConfirmClearData] = useState(false);

  useEffect(() => setUserName(fullData.settings.userName || ""), [fullData.settings.userName]);

  const save = () => update((prev) => ({ ...prev, settings: { ...prev.settings, userName: userName.trim() } }));
  const clearName = () => { setUserName(""); update((prev) => ({ ...prev, settings: { ...prev.settings, userName: "" } })); };
  const clearAllData = () => {
    update(() => ({ ...DEFAULT_DATA }));
    setConfirmClearData(false);
  };

  const addSemester = () => {
    if (!newSemester.trim()) return;
    update((prev) => ({ ...prev, semesters: [...prev.semesters, { id: uid(), label: newSemester.trim() }] }));
    setNewSemester("");
  };

  const removeSemester = (id) => {
    update((prev) => {
      const remaining = prev.semesters.filter((s) => s.id !== id);
      const fallbackId = remaining[0]?.id || "";
      const next = {
        ...prev, semesters: remaining,
        subjects: prev.subjects.map((s) => (s.semesterId === id ? { ...s, semesterId: fallbackId } : s)),
        schedule: prev.schedule.map((s) => (s.semesterId === id ? { ...s, semesterId: fallbackId } : s)),
        internships: prev.internships.map((i) => (i.semesterId === id ? { ...i, semesterId: fallbackId } : i)),
        vacations: prev.vacations.map((v) => (v.semesterId === id ? { ...v, semesterId: fallbackId } : v)),
        holidays: prev.holidays.map((h) => (h.semesterId === id ? { ...h, semesterId: fallbackId } : h)),
        cancelledClasses: prev.cancelledClasses.map((c) => (c.semesterId === id ? { ...c, semesterId: fallbackId } : c)),
      };
      next.settings = { ...prev.settings };
      if (prev.settings.selectedSemesterId === id) next.settings.selectedSemesterId = fallbackId;
      if (prev.settings.currentSemesterId === id) next.settings.currentSemesterId = fallbackId;
      return next;
    });
    setConfirmDeleteSemester(null);
  };

  const totalRecords = fullData.subjects.length + fullData.tasks.length + fullData.exams.length + fullData.contents.length + fullData.studySessions.length + fullData.revisions.length + fullData.schedule.length + fullData.internships.length + fullData.absences.length + fullData.vacations.length + fullData.holidays.length;
  const subjectsInSemester = (id) => fullData.subjects.filter((s) => s.semesterId === id).length;

  return (
    <div>
      <PageHeader title="Configurações" subtitle="Personalize sua experiência no Estudo Organizado." />
      <div style={{ maxWidth: 500, display: "flex", flexDirection: "column", gap: 14 }}>
        <Panel title="Perfil">
          <Field label="Como podemos te chamar?">
            <div style={{ display: "flex", gap: 8 }}>
              <input style={fieldStyle} value={userName} onChange={(e) => setUserName(e.target.value)} placeholder="Seu nome ou apelido" onKeyDown={(e) => e.key === "Enter" && save()} />
              <Button size="sm" onClick={save}>Salvar</Button>
              {fullData.settings.userName && <Button size="sm" variant="secondary" onClick={clearName}>Limpar</Button>}
            </div>
          </Field>
          <div style={{ fontSize: 12.5, color: "var(--text-mute)" }}>Usado na saudação da Visão Geral.</div>
        </Panel>

        <Panel title="Semestres">
          <div style={{ fontSize: 12.5, color: "var(--text-mute)", marginBottom: 10 }}>Defina qual semestre está atualmente em andamento e adicione semestres personalizados, se o seu curso tiver duração diferente.</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 12 }}>
            {semesters.map((s) => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 10, background: s.id === currentSemesterId ? "var(--bg-alt)" : "var(--bg)" }}>
                <span style={{ flex: 1, fontSize: 13.5, fontWeight: 600 }}>{s.label}</span>
                <span style={{ fontSize: 11.5, color: "var(--text-mute)" }}>{subjectsInSemester(s.id)} matéria(s)</span>
                {s.id === currentSemesterId ? <Badge bg="var(--success-bg)" color="var(--success)">Atual</Badge> :
                  <Button size="sm" variant="subtle" onClick={() => { setCurrentSemesterId(s.id); setSelectedSemesterId(s.id); }}>Marcar como atual</Button>}
                {semesters.length > 1 && <IconBtn icon="trash" onClick={() => setConfirmDeleteSemester(s.id)} />}
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <input style={fieldStyle} value={newSemester} onChange={(e) => setNewSemester(e.target.value)} placeholder="Ex: 9º semestre ou Estágio" onKeyDown={(e) => e.key === "Enter" && addSemester()} />
            <Button icon="plus" size="sm" onClick={addSemester}>Adicionar</Button>
          </div>
        </Panel>

        <Panel title="Seus dados">
          <div style={{ fontSize: 13.5, color: "var(--text-soft)", lineHeight: 1.7 }}>
            Você tem <strong>{totalRecords}</strong> registros salvos em todos os semestres: {fullData.subjects.length} matéria(s), {fullData.tasks.length} tarefa(s), {fullData.exams.length} avaliação(ões), {fullData.contents.length} conteúdo(s), {fullData.studySessions.length} sessão(ões) de estudo, {fullData.revisions.length} revisão(ões), {fullData.schedule.length} aula(s) na grade, {fullData.internships.length} estágio(s), {fullData.absences.length} registro(s) de falta e {fullData.vacations.length} período(s) de férias.
            <br /><br />
            Todos os dados ficam salvos automaticamente e persistem entre acessos, ficando disponíveis apenas para você.
          </div>
          <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--border-soft)" }}>
            <div style={{ fontSize: 12.5, color: "var(--text-mute)", marginBottom: 8 }}>Apagar tudo e recomeçar do zero — essa ação não pode ser desfeita.</div>
            <Button variant="danger" size="sm" icon="trash" onClick={() => setConfirmClearData(true)}>Limpar todos os dados</Button>
          </div>
        </Panel>

        {typeof window !== "undefined" && window.firebaseAuth && (
          <Panel title="Conta">
            <div style={{ fontSize: 13.5, color: "var(--text-soft)", marginBottom: 12 }}>
              {window.firebaseAuth.currentUser?.email ? `Conectado como ${window.firebaseAuth.currentUser.email}.` : "Você está logado."} Seus dados sincronizam automaticamente entre os aparelhos onde você entrar com esta conta.
            </div>
            <Button variant="secondary" size="sm" onClick={() => window.firebaseAuth.signOut()}>Sair da conta</Button>
          </Panel>
        )}

        <Panel title="Suporte">
          <div style={{ fontSize: 13.5, color: "var(--text-soft)", lineHeight: 1.7 }}>
            Precisa de ajuda ou encontrou um problema? Fale com a gente:
            <br />
            <a href="mailto:plamailypainelfinanceiro@gmail.com" style={{ color: "var(--lavender-deep)", fontWeight: 700, textDecoration: "none" }}>plamailypainelfinanceiro@gmail.com</a>
          </div>
        </Panel>
      </div>

      <ConfirmDialog open={!!confirmDeleteSemester} onCancel={() => setConfirmDeleteSemester(null)}
        message="As matérias vinculadas a este semestre serão movidas para outro semestre da lista, sem perder nenhum dado. Esta ação não pode ser desfeita."
        onConfirm={() => removeSemester(confirmDeleteSemester)} />
      <ConfirmDialog open={confirmClearData} onCancel={() => setConfirmClearData(false)}
        message="Todos os semestres, matérias, tarefas, provas, conteúdos, estudos, revisões, faltas e estágios serão apagados permanentemente. Essa ação não pode ser desfeita."
        onConfirm={clearAllData} />
    </div>
  );
}

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(console.error);
        });
      }
    </script>
  </body>
</html>
